name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://arcane:arcane@localhost:5432/arcane

jobs:
  checks:
    name: Format, lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database-e2e:
    name: Migrations, seeds and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arcane
          POSTGRES_PASSWORD: arcane
          POSTGRES_DB: arcane
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arcane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create environment files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env.local
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret/' apps/api/.env
          sed -i 's/^DEMO_GM_PASSWORD=.*/DEMO_GM_PASSWORD=ci-only-password/' apps/api/.env

      - run: npm run prisma:generate
      - run: npm run prisma -- migrate deploy
      - run: npm run seed
      - run: npm run seed:demo

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t arcane-api .
      - run: docker build -f apps/web/Dockerfile -t arcane-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 .
